name: Daily Trading Workflow
on:
  schedule:
    # 盘中扫描: 交易日 10:00/11:00/13:00/14:00/14:30 → intraday (30min候选池+持仓止损)
    # 【BUG-7修复 (2026-07-27)】增加14:30尾盘扫描, 减少最后1小时盲区
    - cron: '0 2,3,5,6 * * 1-5'
    # 尾盘扫描: 交易日 14:30 → intraday (收盘前最后检查, 防止尾盘急跌漏检)
    - cron: '30 6 * * 1-5'
    # 日线全市场扫描: 交易日 15:05 → scan (更新候选池日线信号)
    - cron: '5 7 * * 1-5'
    # 合规核查+心态日志: 交易日 15:30 → compliance
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      command:
        description: '工作流命令'
        required: false
        default: 'intraday'
        type: choice
        options:
          - intraday
          - scan
          - compliance

env:
  PYTHONPATH: ${{ github.workspace }}/scripts/chanlun-workflow
  TZ: Asia/Shanghai

jobs:
  daily-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install openpyxl numpy pandas scikit-learn==1.7.2

      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc

      - name: Run workflow
        id: workflow
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail  # 确保python退出码不被tee掩盖
          # 定时任务根据cron时间自动选择命令, 手动触发用输入值
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date '+%H')
            MINUTE=$(date '+%M')
            if [ "$HOUR" = "07" ] && [ "$MINUTE" = "05" ]; then
              CMD="scan"          # 15:05 收盘后日线全市场扫描 + 更新候选池
            elif [ "$HOUR" = "07" ] && [ "$MINUTE" = "30" ]; then
              CMD="compliance"    # 15:30 合规核查
            else
              CMD="intraday"      # 盘中30min扫描 + 持仓止损检查
            fi
          else
            CMD="${{ github.event.inputs.command || 'intraday' }}"
          fi
          echo "=== $CMD $(date '+%Y-%m-%d %H:%M') ==="
          cd scripts/chanlun-workflow
          python daily_workflow.py $CMD 2>&1 | tee /tmp/workflow_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Commit Excel changes
        if: success()
        run: |
          cd scripts/chanlun-workflow
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet "动态仓位资金管理法则_执行版.xlsx"; then
            echo "No changes to Excel file"
          else
            git add "动态仓位资金管理法则_执行版.xlsx"
            git commit -m "auto: update candidate pool ($(date '+%Y-%m-%d %H:%M'))"
            git push
            echo "Excel changes committed and pushed"
          fi
