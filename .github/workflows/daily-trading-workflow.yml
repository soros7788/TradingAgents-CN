name: Daily Trading Workflow
on:
  schedule:
    # 盘中扫描: 交易日 10:00/11:00/13:00/14:00/14:30 → intraday (30min候选池+持仓止损)
    # 【BUG-7修复 (2026-07-27)】增加14:30尾盘扫描, 减少最后1小时盲区
    - cron: '0 2,3,5,6 * * 1-5'
    # 尾盘扫描: 交易日 14:30 → intraday (收盘前最后检查, 防止尾盘急跌漏检)
    - cron: '30 6 * * 1-5'
    # 日线全市场扫描 + 合规核查: 交易日 15:05 → scan_then_compliance
    # scan成功后在同一job继续执行compliance
    - cron: '5 7 * * 1-5'
    # 合规核查兜底: 交易日 15:30 → compliance (独立fallback, 防scan_then_compliance超时)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      command:
        description: '工作流命令'
        required: false
        default: 'intraday'
        type: choice
        options:
          - intraday
          - scan
          - compliance
          - scan_then_compliance  # scan成功后自动执行compliance

env:
  PYTHONPATH: ${{ github.workspace }}/scripts/chanlun-workflow
  TZ: Asia/Shanghai

jobs:
  daily-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 15→45分钟, scan_then_compliance需要双步骤时间
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install openpyxl numpy pandas scikit-learn==1.7.2

      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc

      - name: Run workflow
        id: workflow
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail  # 确保python退出码不被tee掩盖
          # 【BUG-9修复 (2026-07-27)】TZ/command选择不匹配
          #
          # 旧代码用 date '+%H' 获取小时, 但 TZ=Asia/Shanghai 使date返回北京时间
          # 而代码检查的是UTC小时("07"), 导致15:05的scan和15:30的compliance
          # 都被误判为intraday → 候选池永不更新 + 合规检查永不执行
          #
          # 修复: 直接用 github.event.schedule 匹配cron表达式
          #       无需依赖时间判断, 彻底消除TZ和延迟问题
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCHEDULE="${{ github.event.schedule }}"
            if [ "$SCHEDULE" = "5 7 * * 1-5" ]; then
              CMD="scan_then_compliance"  # 15:05 收盘后日线扫描 → 成功后继续compliance
            elif [ "$SCHEDULE" = "30 7 * * 1-5" ]; then
              CMD="compliance"    # 15:30 合规核查兜底
            else
              CMD="intraday"      # 盘中30min扫描 + 持仓止损检查
            fi
          else
            CMD="${{ github.event.inputs.command || 'intraday' }}"
          fi

          # BUG修复 (2026-07-29): scan_then_compliance联动模式
          # 先执行scan, 成功后自动执行compliance
          if [ "$CMD" = "scan_then_compliance" ]; then
            echo "=== scan → compliance $(date '+%Y-%m-%d %H:%M') ==="
            cd scripts/chanlun-workflow
            python -u daily_workflow.py scan 2>&1 | tee /tmp/scan_output.txt
            SCAN_EXIT=$?
            if [ $SCAN_EXIT -ne 0 ]; then
              echo "scan失败(exit=$SCAN_EXIT), 跳过compliance"
              exit 1
            fi
            echo "=== scan完成, 开始compliance ==="
            python -u daily_workflow.py compliance 2>&1 | tee /tmp/compliance_output.txt
            exit $?
          fi

          echo "=== $CMD $(date '+%Y-%m-%d %H:%M') ==="
          cd scripts/chanlun-workflow
          python -u daily_workflow.py $CMD 2>&1 | tee /tmp/workflow_output.txt

      - name: Commit Excel changes
        if: success()
        run: |
          cd scripts/chanlun-workflow
          # BUG修复 (2026-07-28): 清理锁文件, 防止被误commit
          rm -f .~lock.* ~lock.* 2>/dev/null || true
          # BUG修复 (2026-07-28): 中文名xlsx改为英文名 trade-workbook.xlsx
          if [ -f "动态仓位资金管理法则_执行版.xlsx" ] && [ ! -f "trade-workbook.xlsx" ]; then
            cp "动态仓位资金管理法则_执行版.xlsx" "trade-workbook.xlsx"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # BUG修复 (2026-07-28): git diff --quiet 对二进制xlsx不可靠
          # 问题: openpyxl修改xlsx后, git diff有时报告"无变更" → 候选池更新被跳过
          # 修复: 用 git diff --name-only 检测, 若有staged变更则强制commit
          #       同时用 md5sum 对比确保内容确实变化时才commit
          BEFORE_MD5=$(git show HEAD:scripts/chanlun-workflow/trade-workbook.xlsx 2>/dev/null | md5sum | cut -d' ' -f1)
          AFTER_MD5=$(md5sum trade-workbook.xlsx | cut -d' ' -f1)
          if [ "$BEFORE_MD5" = "$AFTER_MD5" ]; then
            echo "No changes to Excel file (md5: $AFTER_MD5)"
          else
            git add "trade-workbook.xlsx"
            git rm --cached "动态仓位资金管理法则_执行版.xlsx" 2>/dev/null || true
            git commit -m "auto: update candidate pool ($(date '+%Y-%m-%d %H:%M'))"
            git push
            echo "Excel changes committed and pushed (md5: $BEFORE_MD5 → $AFTER_MD5)"
          fi

      # BUG修复 (2026-07-28): artifact改用英文名, 解决下载后无法打开问题
      # 问题: 中文名xlsx在GitHub Actions artifact下载时:
      #   1. 文件名编码错误 → 下载后文件名乱码 → 无法打开
      #   2. 移动端GitHub App不支持非ASCII artifact文件名
      #   3. git diff对二进制xlsx不可靠, 有时无法检测到变更
      # 修复:
      #   1. 主文件改用英文名 trade-workbook.xlsx
      #   2. artifact上传英文名文件
      #   3. 保留中文名文件作为备份(但不再作为主要操作目标)
      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-workbook-${{ github.run_id }}
          path: scripts/chanlun-workflow/trade-workbook.xlsx
          retention-days: 7
          if-no-files-found: warn
