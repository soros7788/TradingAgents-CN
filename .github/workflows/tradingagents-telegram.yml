name: TradingAgents Intraday Scan

on:
  schedule:
    # 盘中扫描: 交易日 09:35/10:05/11:05/13:05/14:05/14:35
    # 使用 daily_workflow.py intraday 命令 (递归30min候选池+持仓检查)
    - cron: "35 1 * * 1-5"     # 09:35 BJS
    - cron: "5,35 2 * * 1-5"   # 10:05, 10:35
    - cron: "5,35 3 * * 1-5"   # 11:05, 11:35
    - cron: "5,35 5 * * 1-5"   # 13:05, 13:35
    - cron: "5,35 6 * * 1-5"   # 14:05, 14:35

  workflow_dispatch:
    inputs:
      command:
        description: '工作流命令'
        required: false
        default: 'intraday'
        type: choice
        options:
          - intraday
          - plan
          - divergence

env:
  PYTHONPATH: ${{ github.workspace }}/scripts/chanlun-workflow
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/chanlun-workflow/requirements.txt 2>/dev/null || true
          pip install openpyxl numpy pandas scikit-learn==1.7.2

      - name: Run intraday scan
        id: run_intraday
        continue-on-error: true
        run: |
          set +e
          echo "=== Intraday Scan $(date '+%Y-%m-%d %H:%M') ==="

          # 获取定时任务对应的命令
          # 09:35/10:05/10:35/11:05/11:35/13:05/13:35/14:05/14:35 → intraday
          CMD="intraday"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command || 'intraday' }}"
          fi

          echo "Command: $CMD"
          cd scripts/chanlun-workflow
          python -u daily_workflow.py $CMD 2>&1 | tee /tmp/intraday_output.txt
          echo "$?" > /tmp/exit_code.txt

      - name: Send Telegram notification
        run: |
          python - <<'PYEOF'
          import os, sys
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID")
              raise SystemExit(0)

          bj = datetime.now(timezone.utc) + timedelta(hours=8)
          log_path = Path("/tmp/intraday_output.txt")
          log_text = log_path.read_text(encoding="utf-8", errors="ignore") if log_path.exists() else ""

          # 从日志中提取关键信息构建Telegram消息
          msg = []
          msg.append(f"📡 盘中扫描 {bj:%Y-%m-%d %H:%M}")

          # 提取30min确认信号
          confirmed_lines = [l for l in log_text.split('\n') if '30min确认' in l or '★ 30min确认' in l]
          for l in confirmed_lines:
              msg.append(l)

          # 提取5min信号
          fivemin_lines = [l for l in log_text.split('\n') if '5min' in l and ('★' in l or 'DL_P' in l)]
          for l in fivemin_lines[:5]:
              msg.append(l)

          # 提取持仓检查
          entry_lines = [l for l in log_text.split('\n') if '📌' in l]
          for l in entry_lines[:5]:
              msg.append(l)

          # 提取止损告警
          alert_lines = [l for l in log_text.split('\n') if '⚠️' in l or '止损' in l]
          for l in alert_lines[:3]:
              msg.append(l)

          # 提取卖点信号
          sell_lines = [l for l in log_text.split('\n') if '🔴' in l or '确认卖点' in l]
          for l in sell_lines[:5]:
              msg.append(l)

          # 提取中枢破位
          bd_lines = [l for l in log_text.split('\n') if '🔻' in l or '中枢破位' in l]
          for l in bd_lines[:3]:
              msg.append(l)

          # 提取异常
          err_lines = [l for l in log_text.split('\n') if 'ERROR' in l or '错误' in l or '❌' in l]
          for l in err_lines[:5]:
              msg.append(l)

          if len(msg) <= 1:
              msg.append("⚠️ 扫描完成, 无信号输出")
              # 附加日志尾部
              tail = '\n'.join(log_text.split('\n')[-20:])
              msg.append("")
              msg.append("日志尾部:")
              msg.append(tail)

          import requests
          text = '\n'.join(msg)
          chunks = [text[i:i+3800] for i in range(0, len(text), 3800)]
          for chunk in chunks:
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": chunk, "disable_web_page_preview": True},
                  timeout=30,
              )
              if not r.ok:
                  print(f"Telegram send failed: {r.status_code} {r.text}")
          print("Telegram sent.")
          PYEOF